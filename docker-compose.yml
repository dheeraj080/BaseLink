version: '3.8'

services:
  email-db:
    image: postgres:latest
    container_name: email-db
    environment:
      POSTGRES_DB: email_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    networks:
      - email-net
    volumes:
      # Change from /var/lib/postgresql/data to /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d email_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  email-redis:
    image: redis:latest
    container_name: email-redis
    # No password set
    ports:
      - "6379:6379"
    networks:
      - email-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  email-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: email-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - email-net
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  email-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Override any .env values for Docker
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=email-redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=email-rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminPassword123!}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-12345678901234567890123456789012}
      - APP_STORAGE_PATH=/app/storage/scheduled_attachments
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-local-dev-bucket}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - storage_data:/app/storage
    depends_on:
      email-db:
        condition: service_healthy
      email-rabbitmq:
        condition: service_healthy
      email-redis:
        condition: service_healthy
    networks:
      - email-net
    restart: unless-stopped

  email-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5000}
    depends_on:
      - email-backend
    networks:
      - email-net

networks:
  email-net:
    driver: bridge

volumes:
  pgdata:
  storage_data: