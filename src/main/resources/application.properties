# App Info
spring.application.name=EmILY
server.port=5000
server.forward-headers-strategy=framework

# DATA SOURCE - Use service names in Docker
spring.datasource.url=jdbc:postgresql://email-db:5432/email_db?stringtype=unspecified
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# QUARTZ
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.orm.deprecation=error
app.encryption.key=${APP_ENCRYPTION_KEY}

# FLYWAY MIGRATIONS
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# MULTIPART
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# REDIS - Fixed for Docker
spring.data.redis.host=${REDIS_HOST:email-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=false
spring.data.redis.repositories.enabled=false

# RABBITMQ - Fixed for Docker
spring.rabbitmq.host=${RABBITMQ_HOST:email-rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.simple.listener.deserialization.trust.packages=com.em.emily.*

# OPENAPI/SWAGGER
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# SECURITY PROPERTIES
security.jwt.secret=vS9p8u2M5rX7n4Q1z6W0E3t9Y4A8S5D2F1G7H3J6K9L0P3M1N4B7V2C5X8Z1Q9W0
security.jwt.access-ttl-seconds=3600
security.jwt.refresh-ttl-seconds=2592000
security.jwt.issuer=EmILY
security.jwt.refresh-token-cookie-name=refresh_token
security.jwt.cookie-http-only=true
security.jwt.cookie-secure=false
security.jwt.cookie-domain=
security.jwt.cookie-same-site=Lax

# OAUTH2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# MANAGEMENT
management.endpoints.web.exposure.include=*

# AWS S3 STORAGE
app.storage.s3.bucket-name=${S3_BUCKET_NAME:emily-attachments}
app.storage.s3.region=${AWS_REGION:us-east-1}

# LOCAL FILE STORAGE
app.storage.local.path=${APP_STORAGE_PATH:/app/storage/scheduled_attachments}

# SYSTEM ADMIN SEED CONFIG
app.admin.email=${ADMIN_EMAIL:admin@emily.local}
app.admin.password=${ADMIN_PASSWORD:admin123}